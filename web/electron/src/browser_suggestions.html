<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
  /><title>Saved pages</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 13px system-ui;
      background: light-dark(#fff, #202024);
      color: light-dark(#242428, #eee);
    }
    body {
      margin: 5px;
    }
    button {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover,
    button:focus-visible,
    button[aria-selected="true"] {
      background: light-dark(#eef1f8, #353844);
      outline: none;
    }
    span {
      min-width: 0;
    }
    strong,
    small {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    small {
      opacity: 0.65;
      margin-top: 3px;
    }
  </style>
  <body>
    <div id="rows" role="listbox" aria-label="Suggested pages"></div>
    <script src="browser_suggestions.js"></script>
  </body>
</html>
